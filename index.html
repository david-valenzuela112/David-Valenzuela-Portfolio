<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Valenzuela | Mechatronics Showcase</title>
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Barra de Navegación -->
  <nav class="navbar">
    <div class="nav-container">
      <span class="nav-logo">David Valenzuela</span>
      
      <div class="nav-links">
        <a href="#about" id="nav-about">Sobre mí</a>
        <a href="#projects" id="nav-projects">Proyectos Destacados</a>
        <a href="#certifications" id="nav-certifications">Certificaciones</a>
      </div>

      <button id="lang-toggle" onclick="toggleLanguage()" class="apple-btn">English</button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <div class="avatar-container">
        <img src="foto-david-valenzuela.png" alt="David Valenzuela" class="hero-avatar">
      </div>
      <h1 class="hero-title">David Valenzuela</h1>
      <p id="hero-tagline" class="hero-subtitle"></p>
      
      <div class="institution-pills">
        <span class="pill"><img src="udem.png" alt="UDEM"> UDEM</span>
        <span class="pill"><img src="uottawa.png" alt="uOttawa"> uOttawa</span>
      </div>
    </div>
  </section>

  <!-- Sección Sobre Mí -->
  <section id="about" class="container reveal">
    <div class="about-clean">
      <h2 id="about-title" class="section-title"></h2>
      <p id="about-desc" class="about-text"></p>
    </div>
  </section>

  <!-- Sección Proyectos -->
  <section id="projects" class="container">
    <h2 id="projects-title" class="section-title reveal"></h2>
    <div id="projects-grid" class="showcase-list"></div>
  </section>

  <!-- Sección Certificaciones -->
  <section id="certifications" class="container reveal">
    <h2 id="cert-title" class="section-title"></h2>
    
    <!-- Filtros de Categorías para el Carrusel -->
    <div class="cert-filters">
      <button class="filter-btn active" onclick="filterCertificates('all')" id="filter-all">Todos</button>
      <button class="filter-btn" onclick="filterCertificates('robotics')" id="filter-robotics">Robótica</button>
      <button class="filter-btn" onclick="filterCertificates('courses')" id="filter-courses">Cursos</button>
      <button class="filter-btn" onclick="filterCertificates('projects')" id="filter-projects">Proyectos</button>
    </div>

    <!-- Carrusel de Imágenes PNG -->
    <div class="carousel-wrapper">
      <button class="carousel-arrow prev" onclick="moveCarousel(-1)">&#10094;</button>
      <div class="carousel-container" id="carousel-track">
        <!-- Render dinámico desde script.js -->
      </div>
      <button class="carousel-arrow next" onclick="moveCarousel(1)">&#10095;</button>
    </div>

    <!-- Subsección de Logros en Texto -->
    <div class="text-achievements-container">
      <h3 id="achievements-title" class="sub-section-title">Logros y Reconocimientos</h3>
      <div id="text-achievements-grid" class="text-achievements-grid">
        <!-- Render dinámico desde script.js -->
      </div>
    </div>
  </section>

  <script src="script.js?v=8"></script>
</body>
</html>
